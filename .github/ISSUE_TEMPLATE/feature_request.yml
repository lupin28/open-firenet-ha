name: Idea or feature request
description: Suggest a new entity, option or improvement for the Home Assistant integration.
labels: ["enhancement"]
body:
  - type: textarea
    id: need
    attributes:
      label: What would you like to do
      description: Describe the need rather than the solution; say what you cannot do today in Home Assistant.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: How you imagine it (entity type, option, automation...), if you have something in mind.
  - type: input
    id: stove
    attributes:
      label: Stove model and firmware version
      placeholder: e.g. INDUO 2.27
